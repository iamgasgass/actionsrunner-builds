name: iLoaderX
options:
  # Brand reverse-DNS prefix. NOTE: this is a chosen handle only — it is NOT
  # tied to an Apple Developer account (DEVELOPMENT_TEAM stays empty below).
  bundleIdPrefix: com.iamgasgass
  # iOS 27 is what pairs itself; 17.4 is what the rest of the pipeline needs
  # (CoreDeviceProxy over LocalDevVPN, and the Rust core's minos), and an older
  # iPhone gets there by importing a pairing file made on a computer.
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    # aws-lc-rs / idevice are arm64-only here; drop x86_64 sim slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Distribution hygiene: NO team is pinned. Whoever builds this must select
    # their OWN signing team in Xcode (Signing & Capabilities), which signs the
    # app with their account — never the original author's. Leave empty.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  iLoaderX:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: SideInstallerFFI.xcframework
        embed: false
      # Embedded as PlugIns/iLoaderXLiveActivity.appex.
      - target: iLoaderXLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.iloaderx
        INFOPLIST_FILE: ios-app/Info.plist
        # Primary icon: AppIcon.appiconset, the same artwork as the in-app logo
        # (AppLogo) on every iOS, with its Dark and Tinted variants.
        # Alternate: the iOS 6 one, picked in Settings › App Icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-iOS6
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Garnet: system controls, alerts and links (Theme.swift has the rest).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # idevice's static lib pulls in C++ symbols (aws-lc); link libc++.
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
    # `xcodebuild test -scheme iLoaderX` runs iLoaderXTests too. A
    # build or archive of the scheme still builds the app alone.
    scheme:
      testTargets:
        - iLoaderXTests

  # Unit tests (Swift Testing), run inside the app on a simulator, so they can
  # reach its internal types with `@testable import iLoaderX`.
  # scripts/check-ios.sh builds and runs them, as the pull-request workflow does.
  iLoaderXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios-tests
    dependencies:
      - target: iLoaderX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.iloaderx.tests
        GENERATE_INFOPLIST_FILE: YES

  # Draws the pairing Live Activity: the code Settings asks for, in the Dynamic
  # Island and on the Lock Screen. A Live Activity's views have to live in a
  # widget extension; the app starts and updates it (PairingLiveActivity.swift).
  # Also draws an install's progress below iOS 26 (InstallActivity.swift).
  iLoaderXLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ios-live-activity
      # What the activities show, shared with the app.
      - path: ios-app/PairingActivityAttributes.swift
      - path: ios-app/InstallActivityAttributes.swift
    settings:
      base:
        # Has to stay the app's identifier plus a suffix, or iOS refuses to
        # install the app. Change both together.
        PRODUCT_BUNDLE_IDENTIFIER: com.iamgasgass.iloaderx.LiveActivity
        INFOPLIST_FILE: ios-live-activity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
