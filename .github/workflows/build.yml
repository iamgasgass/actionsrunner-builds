name: Build iLoader X

# Builds iLoader X's unsigned IPA (scripts/build-ipa.sh: the Rust library, an
# Xcode project from project.yml, a Release build with signing off) on every
# push to main and every pull request, and keeps it on the run page.
# Releases are made by release.yml.
#
# Bundle ID com.iamgasgass.iloaderx (Live Activity: .LiveActivity).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iloaderx-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Xcode 27 with the iOS 27.x SDK, nothing older (select-xcode.sh, build-ipa.sh).
  MIN_IOS_SDK: "27.0"

jobs:
  build:
    name: Build the unsigned IPA
    # Xcode 27 / iOS 27.x SDK: GitHub's hosted images don't have it yet, so set the
    # repository variable IOS27_RUNNER to a runner that does, e.g.
    # ["self-hosted","macOS","xcode-27"] (README › Building).
    runs-on: ${{ fromJSON(vars.IOS27_RUNNER || '"macos-26"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode with the newest iOS 27.x SDK
        shell: bash
        env:
          XCODE: ${{ vars.XCODE }}
          PREFER_NEWEST: ${{ vars.XCODE_PREFER_NEWEST }}
        run: bash scripts/select-xcode.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          if ! command -v rustup >/dev/null; then   # a self-hosted Mac without Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-ios
          xcodegen --version | tail -1
          rustc --version

      - name: Restore the Rust library
        id: ffi-cache
        uses: actions/cache@v4
        with:
          path: SideInstallerFFI.xcframework
          key: iloaderx-ffi-ios-${{ hashFiles('rust-core/**', 'build-rust.sh') }}

      - name: Restore the Rust build folder
        if: steps.ffi-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: iloaderx-cargo-ios-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: iloaderx-cargo-ios-

      - name: Build the IPA
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: com.iamgasgass.iloaderx
          OUTPUT: ${{ runner.temp }}/ipa/iLoaderX.ipa
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: bash scripts/build-ipa.sh

      - name: Check the icons made it in
        shell: bash
        run: |
          set -euo pipefail
          app="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/iLoaderX.app"
          plutil -p "$app/Info.plist" | grep -A12 CFBundleIcons | tee -a "$GITHUB_STEP_SUMMARY" || true
          plutil -p "$app/Info.plist" | grep -q 'AppIcon-iOS6' ||
            { echo "::error::the iOS 6 alternate icon isn't in the app's Info.plist"; exit 1; }
          version="$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")"
          echo "VERSION_BUILT=$version" >> "$GITHUB_ENV"

      - name: Keep the IPA on the run page
        uses: actions/upload-artifact@v4
        with:
          name: iLoaderX-${{ env.VERSION_BUILT }}-build${{ github.run_number }}-unsigned
          path: ${{ runner.temp }}/ipa/iLoaderX.ipa
          if-no-files-found: error
          retention-days: 30
