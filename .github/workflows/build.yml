name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: CarPlayss
  SCHEME: CarPlayss

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log || { grep -E "error:" xcodebuild.log | head -n 80; tail -n 80 xcodebuild.log; exit 1; }

      - name: Embed CarPlay apps (EmbeddedApps/*.ipa)
        run: python3 scripts/embed_carplay_apps.py "build/Build/Products/Release-iphoneos/$APP_NAME.app" EmbeddedApps

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH" || { echo "App non trovata in $APP_PATH"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -rf "Payload/$APP_NAME.app/_CodeSignature"
          mkdir -p output
          zip -qry "output/$APP_NAME.ipa" Payload
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: output/${{ env.APP_NAME }}.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/${{ env.APP_NAME }}.ipa
          generate_release_notes: true
