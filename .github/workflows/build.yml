name: Build iLoader X

# Builds iLoader X's unsigned IPA (scripts/build-ipa.sh: the Rust library, an
# Xcode project from project.yml, a Release build with signing off) and puts
# it on the rolling release "iloaderx-latest" as iLoaderX.ipa, titled
# "iLoader X <version>": the in-app update banner reads that title, and Side by
# Side downloads that IPA. Sign it with SideStore, AltStore, iLoader,
# Sideloadly, or install it with TrollStore.
#
# Bundle ID com.iamgasgass.iloaderx (Live Activity: .LiveActivity).

on:
  push:
    branches: [iloaderx, "claude/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (CFBundleShortVersionString), e.g. 1.0.0. Empty = project.yml's"
        type: string
        default: ""
      publish:
        description: "Update the iloaderx-latest release with this IPA"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: iloaderx-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # build-ipa.sh refuses an older iOS SDK (the code needs the iOS 27 SDK).
  MIN_IOS_SDK: "27.0"

jobs:
  build:
    name: Build the unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          rustup target add aarch64-apple-ios
          xcodegen --version | tail -1
          rustc --version

      - name: Restore the Rust library
        id: ffi-cache
        uses: actions/cache@v4
        with:
          path: SideInstallerFFI.xcframework
          key: iloaderx-ffi-ios-${{ hashFiles('rust-core/**', 'build-rust.sh') }}

      - name: Restore the Rust build folder
        if: steps.ffi-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: iloaderx-cargo-ios-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: iloaderx-cargo-ios-

      - name: Build the IPA
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: com.iamgasgass.iloaderx
          OUTPUT: ${{ runner.temp }}/ipa/iLoaderX.ipa
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: bash scripts/build-ipa.sh

      - name: Check the icons made it in
        shell: bash
        run: |
          set -euo pipefail
          app="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/iLoaderX.app"
          plutil -p "$app/Info.plist" | grep -A12 CFBundleIcons | tee -a "$GITHUB_STEP_SUMMARY" || true
          plutil -p "$app/Info.plist" | grep -q 'AppIcon-iOS6' ||
            { echo "::error::the iOS 6 alternate icon isn't in the app's Info.plist"; exit 1; }
          version="$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")"
          echo "VERSION_BUILT=$version" >> "$GITHUB_ENV"

      - name: Keep the IPA on the run page
        uses: actions/upload-artifact@v4
        with:
          name: iLoaderX-${{ env.VERSION_BUILT }}-${{ github.run_number }}-unsigned
          path: ${{ runner.temp }}/ipa/iLoaderX.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Update the iloaderx-latest release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA: ${{ runner.temp }}/ipa/iLoaderX.ipa
        run: |
          set -euo pipefail
          title="iLoader X $VERSION_BUILT"
          notes="Unsigned build ${GITHUB_SHA:0:7} from $GITHUB_REF_NAME (run $GITHUB_RUN_NUMBER). Bundle ID com.iamgasgass.iloaderx. iLoader X is a fork of SideInstaller by FrizzleM: https://github.com/FrizzleM/SideInstaller"
          if gh release view iloaderx-latest >/dev/null 2>&1; then
            gh release edit iloaderx-latest --title "$title" --notes "$notes" --prerelease=false --latest=false
            gh release upload iloaderx-latest "$IPA" --clobber
          else
            gh release create iloaderx-latest "$IPA" --title "$title" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
          echo "Published: $(gh release view iloaderx-latest --json url -q .url)" | tee -a "$GITHUB_STEP_SUMMARY"
