name: Build iOS App

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configurazione di build"
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GestAltX.xcodeproj
  SCHEME: GestAltX
  APP_NAME: GestAltX

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v6

      - name: Seleziona l'Xcode più recente
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Archivia (senza firma)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build-archive.log

      - name: Crea IPA non firmato
        run: |
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH" || { echo "::error::App non trovata in $APP_PATH"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "$APP_NAME-unsigned.ipa" Payload)
          ls -lh "build/$APP_NAME-unsigned.ipa"
          echo "### IPA non firmato pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle ID: com.iamgasgass.gestaltx — firmalo con iLoader, AltStore, SideStore o Sideloadly." >> "$GITHUB_STEP_SUMMARY"

      - name: Carica IPA non firmato
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: build/${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$APP_NAME-unsigned.ipa" \
            --title "$APP_NAME $GITHUB_REF_NAME" \
            --generate-notes
