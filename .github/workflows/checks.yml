name: checks

# Checks every pull request, and every push to main, in three jobs that run
# side by side:
#
#   rust          the Rust tests (scripts/test-rust.sh: rust-core's own, then
#                 those of the crates vendored under rust-core/vendor/, such as
#                 idevice's OPACK decoder and isideload's 2FA handling) and
#                 clippy, with warnings as errors, on rust-core
#   ios           the app built for the simulator and its unit tests
#                 (scripts/check-ios.sh: iLoaderXTests, ios-tests/)
#   translations  every string passed to L("…") against each language's table
#                 (scripts/check_translations.py): a string left untranslated
#                 by this change fails, as do a duplicate key (it stops the app)
#                 and a translation whose %@ / %d differ from the English
#
# Each script runs the same on a Mac, so a failure can be reproduced locally;
# scripts/check-ios.sh wants a clean clone or worktree, since it generates the
# Xcode project.
#
# Pushes to main run it too: a direct push is checked like a pull request, and
# the caches it saves are the ones pull requests start from (GitHub doesn't let
# one pull request read another's).
#
# Nothing here signs, publishes or needs a secret, so pull requests from forks
# run it as they are.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  # A newer push to a pull request replaces its run; main's runs all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # No debug info or incremental files: the tests don't need them, and they
      # would make the build folder (cached below) several times larger.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup component add clippy
          rustc --version
          cargo clippy --version

      # Only rust-core/Cargo.lock names the key, so a change to the code itself
      # starts from the last build of the same dependencies.
      - name: Restore the Rust build folder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Tests
        shell: bash
        env:
          # Stop when rust-core/Cargo.lock doesn't match Cargo.toml.
          LOCKED: "1"
        run: bash scripts/test-rust.sh

      - name: Clippy
        shell: bash
        working-directory: rust-core
        run: cargo clippy --locked --all-targets -- -D warnings

  ios:
    name: Simulator build and Swift tests
    # GitHub's Xcode 27 image (macOS 27), as in build.yml.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode (the newest SDK on the runner)
        env:
          # iLoader X builds with Xcode 27.2 and the iOS 27.2 SDK. The repository variables ILOADERX_XCODE and
          # ILOADERX_IOS_SDK change them (e.g. to try a newer Xcode when GitHub adds one).
          PIN: ${{ vars.ILOADERX_XCODE || '27.2' }}
          WANT_SDK: ${{ vars.ILOADERX_IOS_SDK || '27.2' }}
        run: |
          set -euo pipefail
          # Every Xcode on the runner, by the version in its own Info.plist (folder names vary: Xcode_27.0.app,
          # Xcode_27.0_beta.app, Xcode-beta.app, symlinks), with its iOS SDK. The newest wins, betas included;
          # at an equal version a release beats a beta. ILOADERX_XCODE (a version, e.g. 27.1) pins one instead.
          echo "### Xcode on this runner" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | build | iOS SDK | path |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          candidates=""
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            plist="$app/Contents/Info.plist"
            [ -f "$plist" ] || continue
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$app/Contents/version.plist" 2>/dev/null || echo '?')"
            sdk="$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo '?')"
            case "$app" in *[Bb]eta*|*_RC*|*_rc*|*Release_Candidate*) rel=0 ;; *) rel=1 ;; esac
            echo "  $ver ($build), iOS SDK $sdk: $app"
            echo "| $ver | $build | $sdk | \`$app\` |" >> "$GITHUB_STEP_SUMMARY"
            candidates+="$ver.$rel $app"$'\n'
          done
          if [ -n "$PIN" ]; then
            app="$(printf '%s' "$candidates" | awk -v pin="$PIN" 'index($1, pin".") == 1' | sort -V -k1,1 | tail -1 | cut -d' ' -f2)"
          else
            app="$(printf '%s' "$candidates" | sort -V -k1,1 | tail -1 | cut -d' ' -f2)"
          fi
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::no Xcode found (pin: ${PIN:-none})"; exit 1; }
          sudo xcode-select -s "$app/Contents/Developer"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          ver="$(xcodebuild -version | awk '/^Xcode/{print $2}')"
          [ "${ver%%.*}" -ge 27 ] || { echo "::error::Xcode $ver is too old: iLoader X needs Xcode 27 and the iOS 27 SDK"; exit 1; }
          sdk_now="$(xcrun --sdk iphoneos --show-sdk-version)"
          [ -z "$WANT_SDK" ] || [ "$sdk_now" = "$WANT_SDK" ] || {
            echo "::error::Xcode $ver has the iOS SDK $sdk_now, not $WANT_SDK: iLoader X must build with the iOS $WANT_SDK SDK"; exit 1; }
          echo "Building with Xcode $ver, iOS SDK $sdk_now ($app)"
          echo "**Building with Xcode $ver, iOS SDK $sdk_now**" >> "$GITHUB_STEP_SUMMARY"
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/{print $3}')" >> "$GITHUB_ENV"
          echo "IOS_SDK=$sdk_now" >> "$GITHUB_ENV"


      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          if ! command -v rustup >/dev/null; then   # a self-hosted Mac without Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-ios-sim
          echo "xcodegen $(xcodegen --version 2>/dev/null | tail -1)"
          rustc --version

      # The Rust library only changes with rust-core/, so it's kept between
      # runs and the Rust build is skipped when nothing there moved. This has
      # to come before the build-folder cache below, which puts rust-core/target
      # in place and would end up in the hash.
      - name: Restore the Rust library
        id: ffi-cache
        uses: actions/cache@v4
        with:
          path: SideInstallerFFI.xcframework
          key: ffi-sim-${{ env.XCODE_BUILD }}-${{ hashFiles('rust-core/**', 'build-rust.sh') }}

      - name: Restore the Rust build folder
        if: steps.ffi-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: cargo-sim-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: cargo-sim-

      - name: Build for the simulator and run the Swift tests
        shell: bash
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/iLoaderXTests.xcresult
        run: bash scripts/check-ios.sh

      # Opens in Xcode (File › Open) with each test's failure and the logs.
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iLoaderXTests-xcresult
          path: ${{ runner.temp }}/iLoaderXTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pull request is checked out as its merge into the base branch, whose
      # first parent is the base branch: that's what it's compared with.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check the translations
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT" == "pull_request" ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] &&
               git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [[ -n "$base" ]]; then
            python3 scripts/check_translations.py --base "$base"
          else
            echo "::notice::No earlier commit to compare with, so missing translations are listed, not failed."
            python3 scripts/check_translations.py
          fi
