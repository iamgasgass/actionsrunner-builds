name: Xcode probe

# Lists the Xcode versions and iOS SDKs on GitHub's macOS runners and on the
# runner set in IOS27_RUNNER, and which one scripts/select-xcode.sh would take
# (iLoader X needs Xcode 27 with the iOS 27.x SDK). Run it from Actions.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: ['"macos-26"', '"macos-latest"', "${{ vars.IOS27_RUNNER || '\"macos-26\"' }}"]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Xcodes and SDKs
        shell: bash
        run: |
          sw_vers
          SELECT_XCODE_DRY=1 GITHUB_ENV= bash scripts/select-xcode.sh || true
