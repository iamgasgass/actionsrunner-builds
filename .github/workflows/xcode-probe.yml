name: Xcode probe

# Lists the Xcode versions and iOS SDKs on GitHub's macOS runners, to find
# the one with the newest iOS 27.x SDK. Run it from Actions when a build
# can't find Xcode 27.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-latest, macos-27, macos-26-xlarge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Xcodes and SDKs
        run: |
          sw_vers
          for x in /Applications/Xcode*.app; do
            v=$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "?")
            sdk=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "?")
            echo "$x | Xcode $v | iOS SDK $sdk" | tee -a "$GITHUB_STEP_SUMMARY"
          done
