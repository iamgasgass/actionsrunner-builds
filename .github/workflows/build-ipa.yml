# .github/workflows/build-ipa.yml
#
# Henge X: builds Henge-X.ipa (SideStore / AltStore) and Henge-X.tipa (TrollStore) for every
# supported iPhone and iPad (A14 / M1 or newer, iOS 17+), from a clean checkout, as WindowsiOS X's
# build-ipa.yml builds WindowsiOS-X.ipa.
#
#   push to main or claude/**                build, keep both files as workflow artifacts
#   push of a tag like hengex-v1.0.0      the same, and publish them on that tag's release
#   Run workflow (Actions tab, manual)       the same from the branch you pick; "release" also publishes
#
# "Unsigned" as sideloaders mean it: ad hoc signed with the entitlements embedded (ios/scripts/package_ipa.sh),
# so SideStore / AltStore re-sign it at install and TrollStore installs the .tipa as it is.
# Builds with the newest Xcode on the runner, betas included (26 or later; the variable HENGEX_XCODE pins
# one). The iPhone Duo's hinge sensor (UIHingeInteraction) is compiled in only when that SDK has it.
# The engine links a few iOS libraries built from Leviidev/Husk (glib, libslirp, the pairing library,
# StikJIT): they are built here and cached, so only the first run is slow.

name: Build IPA

on:
  push:
    branches: [main, 'claude/**']
    tags: ['hengex-v[0-9]+.[0-9]+*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Screenshots/**'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the IPA and the TIPA
        type: boolean
        default: false
      tag:
        description: Release tag (empty = hengex-v + CFBundleShortVersionString)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  # The engine's own tests (CPU translator, MMU, exceptions, devices) on Apple silicon: the JIT runs
  # arm64 code natively, so this is the one place every engine change is exercised before a device.
  engine-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out Henge X
        uses: actions/checkout@v4

      - name: Build and run the engine tests
        run: |
          set -euo pipefail
          uname -m
          clang --version | head -1
          make -j"$(sysctl -n hw.ncpu)" build/test_classify build/test_jit_region build/test_operands
          make test-engine

      - name: Benchmark the JIT against native code
        # Times typical guest code shapes (calls, loads and stores, an interpreter loop, block exits)
        # natively and through the JIT: the ratio is what an engine change moves. Three runs, as runners vary.
        run: |
          set -euo pipefail
          make build/test_bench
          for i in 1 2 3; do echo "== run $i"; build/test_bench; done

      - name: Static analysis of the engine (clang --analyze)
        # Every C file of the engine, its devices and the host side, through clang's static analyzer:
        # null dereferences, out-of-bounds reads, leaks, use after free. Reported, not fatal.
        run: |
          set -uo pipefail
          brew list libslirp >/dev/null 2>&1 || brew install libslirp >/dev/null # its header, for host/net_slirp.c
          SLIRP="$(brew --prefix)/include"
          for f in core/*.c devices/*.c host/*.c ios/Henge/Native/henge-vm.c; do
            case "$f" in host/main.c|host/hvf_ref.c|host/libusb_shim.c|host/curl_shim.c|host/install.c) continue;; esac
            clang --analyze -std=gnu11 -Icore -Ihost -Idevices -Iios/Henge/Native -I"$SLIRP" -I"$SLIRP/slirp" -I"$SLIRP/glib-2.0" -I"$(brew --prefix glib)/lib/glib-2.0/include" \
                  -Xanalyzer -analyzer-output=text -o /dev/null "$f" 2>&1 | grep -E "warning:|error:" || true
          done | sort -u | tee analyze.txt
          echo "== $(grep -c 'warning:' analyze.txt || true) analyzer warnings"

  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Check out Henge X
        uses: actions/checkout@v4
        with:
          path: Henge

      - name: Check out Husk (source of the prebuilt iOS libraries)
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Select Xcode (the newest SDK on the runner)
        env:
          PIN: ${{ vars.HENGEX_XCODE }}
        run: |
          set -euo pipefail
          # Every Xcode on the runner, by the version in its own Info.plist (folder names vary: Xcode_27.0.app,
          # Xcode_27.0_beta.app, Xcode-beta.app, symlinks), with its iOS SDK. The newest wins, betas included;
          # at an equal version a release beats a beta. HENGEX_XCODE (a version, e.g. 26.7) pins one instead.
          echo "### Xcode on this runner" >> "$GITHUB_STEP_SUMMARY"
          echo "| Xcode | build | iOS SDK | path |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          candidates=""
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            plist="$app/Contents/Info.plist"
            [ -f "$plist" ] || continue
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$app/Contents/version.plist" 2>/dev/null || echo '?')"
            sdk="$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo '?')"
            case "$app" in *[Bb]eta*|*_RC*|*_rc*|*Release_Candidate*) rel=0 ;; *) rel=1 ;; esac
            echo "  $ver ($build), iOS SDK $sdk: $app"
            echo "| $ver | $build | $sdk | \`$app\` |" >> "$GITHUB_STEP_SUMMARY"
            candidates+="$ver.$rel $app"$'\n'
          done
          if [ -n "$PIN" ]; then
            app="$(printf '%s' "$candidates" | awk -v pin="$PIN" 'index($1, pin".") == 1' | sort -V -k1,1 | tail -1 | cut -d' ' -f2)"
          else
            app="$(printf '%s' "$candidates" | sort -V -k1,1 | tail -1 | cut -d' ' -f2)"
          fi
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::no Xcode found (pin: ${PIN:-none})"; exit 1; }
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          ver="$(xcodebuild -version | awk '/^Xcode/{print $2}')"
          [ "${ver%%.*}" -ge 26 ] || { echo "::error::Xcode $ver is too old: Henge X needs the iOS 26 SDK"; exit 1; }
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Building with Xcode $ver, iOS SDK $sdk ($app)"
          echo "**Building with Xcode $ver, iOS SDK $sdk**" >> "$GITHUB_STEP_SUMMARY"
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/{print $3}')" >> "$GITHUB_ENV"

      - name: Metal toolchain
        run: |
          set -euo pipefail
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version

      - name: Install build tools
        run: |
          set -euxo pipefail
          for tool in xcodegen meson ninja pkg-config cmake; do
            command -v "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Husk revision
        id: husk
        run: echo "rev=$(git -C Husk rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Husk's iOS libraries
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: henge-husk-${{ steps.husk.outputs.rev }}-${{ env.XCODE_BUILD }}

      - name: Fetch Husk's third-party sources
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build the iOS libraries the engine needs (libffi, glib, libslirp)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Check the prebuilt libraries
        run: |
          set -euo pipefail
          test -s Husk/build/ios-arm64/lib/libhusk_rppairing.a
          for dep in libslirp libglib-2.0 libintl libpcre2-8; do
            test -s "$IOS_DEPS/lib/$dep.a" || { echo "::error::missing $dep.a"; exit 1; }
          done
          test -d Husk/src/app/Frameworks/StikJIT.xcframework || { echo "::error::Husk has no StikJIT.xcframework"; exit 1; }

      - name: Copy the prebuilt libraries into the app
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge-X.ipa
        working-directory: Henge
        run: |
          zsh ios/scripts/package_ipa.sh || { tail -n 200 ios/build/DerivedData.buildlog || true; exit 1; }

      - name: Package Henge-X.tipa (TrollStore)
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh --trollstore

      - name: Version
        working-directory: Henge
        run: echo "VERSION=$(plutil -extract CFBundleShortVersionString raw ios/Henge/Info.plist)" >> "$GITHUB_ENV"

      - name: Upload Henge-X.ipa and .tipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-X-${{ env.VERSION }}-${{ github.sha }}
          path: |
            ~/Desktop/Henge-X.ipa
            ~/Desktop/Henge-X.tipa
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/hengex-v') || inputs.release
        working-directory: Henge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="hengex-v$VERSION"; fi
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Henge X $TAG" \
            --notes "macOS on iPhone and iPad (A14 / M1 or newer, iOS 17+). Henge-X.ipa: SideStore / AltStore. Henge-X.tipa: TrollStore. JIT: StikDebug, TrollStore or the built-in helper (iOS 26+)."
          gh release upload "$TAG" ~/Desktop/Henge-X.ipa ~/Desktop/Henge-X.tipa --clobber
