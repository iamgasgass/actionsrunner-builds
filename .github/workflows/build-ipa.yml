# SPDX-License-Identifier: GPL-2.0-or-later
#
# WindowsiOS X: build an unsigned WindowsiOS-X.ipa for every supported iPhone/iPad
# (A14 / M1 or newer, iOS 17+), from a clean checkout.
#
#   push / pull request        build and keep the IPA as a workflow artifact
#   push of a tag like v1.1.0  build and publish WindowsiOS-X.ipa on that tag's release
#   Run workflow (manual)      build; "release" also publishes
#
# "Unsigned" as sideloaders mean it: ad hoc signed with WindowsiOS.entitlements embedded,
# so SideStore / AltStore re-sign it at install and TrollStore installs it as it is.
# Builds with the newest Xcode on the runner ('latest', betas included). UIHingeInteraction (iPhone Duo)
# is compiled in only when that SDK has it (-D WINIOS_HINGE); otherwise the app builds without it.
# The variable WINIOS_XCODE pins a version.

name: Build IPA

on:
  push:
    branches: [main, universal, 'claude/**']
    tags: ['v[0-9]+.[0-9]+*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the IPA
        type: boolean
        default: false
      tag:
        description: Release tag (empty = v + CFBundleShortVersionString)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.WINIOS_XCODE || 'latest' }}

      - name: Tools
        run: |
          brew install meson ninja pkg-config xcodegen libslirp glib qemu cabextract llvm lld || true
          xcodebuild -version

      - name: Cache iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            ios/deps
            work/ios_deps_build/sysroot
            work/ios_deps_build/stamps
          key: ios-deps-${{ runner.os }}-${{ hashFiles('scripts/build_ios_deps.sh', 'patches/**') }}

      - name: Build libffi + glib + libslirp for arm64-apple-ios
        run: ./scripts/build_ios_deps.sh

      - name: Build libwinvm.a (engine + devices) for iOS
        run: make -j"$(sysctl -n hw.ncpu)" ios-lib

      - name: On-device install resources (catalog, firmware, network driver, lite tool)
        run: |
          G=ios/Sources/Resources/generated
          mkdir -p "$G/firmware" "$G/install/drivers"
          # Microsoft's Windows 11 ARM64 ESDs, one per language (Media Creation Tool catalog)
          python3 scripts/make_windows_catalog.py "$G/windows-catalog.json" \
            || echo "::warning::Windows catalog unavailable: the app will only offer importing an ESD"
          # EDK2 UEFI for the virtual ARM64 PC (BSD-2-Clause-Patent), from Homebrew's QEMU
          Q="$(brew --prefix qemu)/share/qemu"
          cp "$Q/edk2-aarch64-code.fd" "$G/firmware/code.fd"
          cp "$Q/edk2-arm-vars.fd" "$G/firmware/vars.fd"
          ls -l "$G/firmware"
          # Red Hat's WHQL VirtIO network driver (NetKVM) for Windows 11 ARM64
          curl -fL --retry 3 -o /tmp/virtio-win.iso \
            https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso \
            && mkdir -p /tmp/vw && bsdtar -xf /tmp/virtio-win.iso -C /tmp/vw NetKVM \
            && cp -RL /tmp/vw/NetKVM/w11/ARM64 "$G/install/drivers/NetKVM" \
            && ls -l "$G/install/drivers/NetKVM" \
            || echo "::warning::NetKVM driver unavailable: Windows will install without network"
          # Offline registry tool for the "lite" option (tools/opt_hive_arm64.c)
          brew install llvm lld >/dev/null 2>&1 || true
          LLVM_BIN="$(brew --prefix lld)/bin" CLANG="$(brew --prefix llvm)/bin/clang" \
            DLLTOOL="$(brew --prefix llvm)/bin/llvm-dlltool" \
            ./scripts/build_opt_hive.sh "$G/install/opt_hive_arm64.exe" \
            || echo "::warning::opt_hive_arm64.exe not built: lite install skips service tuning"
          find "$G" -maxdepth 3 | head -40

      - name: Build the app (unsigned)
        run: |
          xcodegen generate --spec ios/project.yml
          # The iPhone Duo's hinge sensor (UIHingeInteraction) needs the iOS 27.1 SDK: compile it in only when present.
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          CONDITIONS='$(inherited)'
          # Decide by compiling a one-line probe against this SDK, not by searching its headers.
          printf 'import UIKit\n@available(iOS 27.1, *) func probe(_ v: UIView) { v.addInteraction(UIHingeInteraction { _, u in if let h = u.hinge { _ = (h.status.rawValue, Double(h.angle)) } }) }\n' > /tmp/hinge_probe.swift
          if xcrun --sdk iphoneos swiftc -typecheck -sdk "$SDK_PATH" -target arm64-apple-ios17.0 /tmp/hinge_probe.swift 2>/dev/null; then
            CONDITIONS="$CONDITIONS WINIOS_HINGE"; echo "UIHingeInteraction: yes"
          else
            echo "UIHingeInteraction: not in this SDK, building without the hinge sensor"
          fi
          xcodebuild -project ios/WindowsiOS.xcodeproj -scheme WindowsiOS -configuration Release \
            -sdk iphoneos -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$CONDITIONS" \
            build

      - name: Package WindowsiOS-X.ipa
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/WindowsiOS.app
          ldid -h >/dev/null 2>&1 || brew install ldid
          ldid -Sios/WindowsiOS.entitlements "$APP/WindowsiOS" || codesign -f -s - --entitlements ios/WindowsiOS.entitlements "$APP"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && rm -f WindowsiOS-X.ipa && zip -qry WindowsiOS-X.ipa Payload)
          ls -lh build/WindowsiOS-X.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-X-${{ env.VERSION }}
          path: build/WindowsiOS-X.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$VERSION"; fi
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "WindowsiOS X $TAG" \
            --notes "Unsigned IPA for iPhone 12 and later (A14+), iPhone Duo, and M1+ iPads. Sideload with SideStore / AltStore / TrollStore, then enable JIT with StikDebug."
          gh release upload "$TAG" build/WindowsiOS-X.ipa --clobber
