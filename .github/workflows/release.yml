name: Release iLoader X

# Actions › Release iLoader X › Run workflow, with a version and the notes:
#
#   1. builds the unsigned IPA with that version (scripts/build-ipa.sh),
#   2. publishes release v<version> with iLoaderX.ipa, marked latest: the
#      in-app update banner and Side by Side read releases/latest,
#   3. puts it on the AltStore / SideStore source (site/iloaderx.json,
#      scripts/update_source.py) and commits that to main,
#   4. redeploys the install page (pages.yml), so the source serves it.
#
# A version that already has a release is refused.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (released as v1.0.0)"
        required: true
        type: string
      notes:
        description: 'Release notes (Markdown). \n for a line break.'
        required: true
        type: string
        default: "First release of iLoader X, based on SideInstaller 2.1.1."

concurrency:
  group: release
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  MIN_IOS_SDK: "27.0"

jobs:
  release:
    name: Build and publish
    # Xcode 27 / iOS 27.x SDK: GitHub's hosted images don't have it yet, so set the
    # repository variable IOS27_RUNNER to a runner that does, e.g.
    # ["self-hosted","macOS","xcode-27"] (README › Building).
    runs-on: ${{ fromJSON(vars.IOS27_RUNNER || '"macos-26"') }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check the version
        id: meta
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$VERSION_INPUT" | tr -d '[:space:]')"; version="${version#[vV]}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "::error::Version must look like 1.0.0 (got: $VERSION_INPUT)"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then echo "::error::v$version already exists"; exit 1; fi
          printf '%b\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select Xcode with the newest iOS 27.x SDK
        shell: bash
        env:
          XCODE: ${{ vars.XCODE }}
          PREFER_NEWEST: ${{ vars.XCODE_PREFER_NEWEST }}
        run: bash scripts/select-xcode.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          if ! command -v rustup >/dev/null; then   # a self-hosted Mac without Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-apple-ios

      - name: Restore the Rust library
        uses: actions/cache@v4
        with:
          path: SideInstallerFFI.xcframework
          key: iloaderx-ffi-ios-${{ hashFiles('rust-core/**', 'build-rust.sh') }}

      - name: Build the IPA
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: com.iamgasgass.iloaderx
          OUTPUT: ${{ runner.temp }}/ipa/iLoaderX.ipa
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: bash scripts/build-ipa.sh

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo "Unsigned IPA, bundle ID \`com.iamgasgass.iloaderx\`. Install: https://iamgasgass.github.io/iLoaderX/"
            echo "iLoader X is a fork of [SideInstaller by FrizzleM](https://github.com/FrizzleM/SideInstaller); it is not the official SideInstaller."
          } > "$RUNNER_TEMP/release.md"
          gh release create "v$VERSION" "$RUNNER_TEMP/ipa/iLoaderX.ipa" \
            --title "iLoader X $VERSION" --notes-file "$RUNNER_TEMP/release.md" --target "$GITHUB_SHA" --latest
          echo "Published $(gh release view "v$VERSION" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Put it on the source
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IPA: ${{ runner.temp }}/ipa/iLoaderX.ipa
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          set -euo pipefail
          python3 scripts/update_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/iloaderx.json
          git commit -m "Source: iLoader X $VERSION"
          git push origin HEAD:main

  pages:
    name: Redeploy the install page
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
